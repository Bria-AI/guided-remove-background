<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playground — Guided Remove Background</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }

.top-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: #1e293b; border-bottom: 1px solid #334155; flex-shrink: 0; }
.top-bar h1 { font-size: 18px; font-weight: 600; color: #f8fafc; }
.top-bar a { color: #60a5fa; text-decoration: none; font-size: 14px; }
.top-bar a:hover { text-decoration: underline; }

.image-picker { display: flex; gap: 8px; padding: 12px 20px; background: #1e293b; border-bottom: 1px solid #334155; overflow-x: auto; flex-shrink: 0; }
.image-picker img { width: 72px; height: 54px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 2px solid transparent; opacity: 0.6; transition: all 0.15s; }
.image-picker img:hover { opacity: 0.9; border-color: #475569; }
.image-picker img.selected { opacity: 1; border-color: #3b82f6; }

.chat-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }

.msg { max-width: 85%; animation: fadeIn 0.2s ease; }
.msg.user { align-self: flex-end; }
.msg.system { align-self: center; }
.msg.assistant { align-self: flex-start; }

.msg-bubble { padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
.msg.user .msg-bubble { background: #3b82f6; color: #fff; border-bottom-right-radius: 4px; }
.msg.system .msg-bubble { background: #334155; color: #94a3b8; font-size: 13px; border-radius: 8px; }
.msg.assistant .msg-bubble { background: #1e293b; border: 1px solid #334155; border-bottom-left-radius: 4px; }

.result-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.mode-badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
.mode-badge.narrow { background: #3b82f6; color: #fff; }
.mode-badge.remove { background: #ef4444; color: #fff; }
.mode-badge.add { background: #22c55e; color: #fff; }
.targets { font-size: 13px; color: #94a3b8; }
.elapsed { font-size: 12px; color: #64748b; margin-left: auto; }

.steps-row { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; }
.step-thumb { width: 100px; flex-shrink: 0; text-align: center; }
.step-thumb img { width: 100px; height: 75px; object-fit: contain; border-radius: 4px; background: #0f172a; cursor: pointer; border: 1px solid #334155; }
.step-thumb img:hover { border-color: #60a5fa; }
.step-thumb .label { font-size: 10px; color: #64748b; margin-top: 3px; }

.final-result { margin-top: 6px; }
.final-result img { max-width: 100%; max-height: 400px; object-fit: contain; border-radius: 6px; background: #0f172a; }

.sam-scores { font-size: 11px; color: #64748b; margin-top: 6px; }

.feedback-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #334155; }
.fb-btn { background: none; border: 1px solid #475569; border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 16px; color: #94a3b8; transition: all 0.15s; display: flex; align-items: center; gap: 4px; }
.fb-btn:hover { border-color: #60a5fa; color: #e2e8f0; }
.fb-btn.active-like { border-color: #22c55e; color: #22c55e; background: rgba(34,197,94,0.1); }
.fb-btn.active-dislike { border-color: #ef4444; color: #ef4444; background: rgba(239,68,68,0.1); }
.fb-btn .icon { font-size: 18px; }
.fb-comment { flex: 1; padding: 6px 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; font-size: 12px; outline: none; }
.fb-comment:focus { border-color: #3b82f6; }
.fb-comment::placeholder { color: #64748b; }
.fb-send { background: none; border: 1px solid #475569; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px; color: #94a3b8; transition: all 0.15s; }
.fb-send:hover { border-color: #60a5fa; color: #e2e8f0; }
.fb-sent { font-size: 12px; color: #22c55e; }

.judge-row { margin-top: 8px; padding-top: 8px; border-top: 1px solid #334155; }
.judge-badge-sm { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px;
                  border-radius: 4px; font-size: 11px; font-weight: 700; }
.judge-badge-sm.pass { background: #166534; color: #4ade80; }
.judge-badge-sm.fail { background: #7f1d1d; color: #fca5a5; }
.judge-issue-sm { font-size: 11px; color: #94a3b8; margin-top: 3px; }
.judge-issue-sm .type { color: #f87171; font-weight: 600; text-transform: uppercase; }
.judge-issue-sm .fix { color: #60a5fa; font-family: monospace; }
.judge-retry-sm { font-size: 11px; color: #64748b; }

.thinking { display: flex; align-items: center; gap: 8px; padding: 10px 14px; }
.thinking .dots { display: flex; gap: 4px; }
.thinking .dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; animation: bounce 1.4s infinite ease-in-out; }
.thinking .dot:nth-child(2) { animation-delay: 0.2s; }
.thinking .dot:nth-child(3) { animation-delay: 0.4s; }

.input-bar { display: flex; gap: 10px; padding: 14px 20px; background: #1e293b; border-top: 1px solid #334155; flex-shrink: 0; }
.input-bar input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; font-size: 14px; outline: none; }
.input-bar input:focus { border-color: #3b82f6; }
.input-bar input::placeholder { color: #64748b; }
.input-bar input:disabled { opacity: 0.5; }
.input-bar button { padding: 10px 20px; border-radius: 8px; border: none; background: #3b82f6; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.input-bar button:hover { background: #2563eb; }
.input-bar button:disabled { opacity: 0.4; cursor: not-allowed; }

.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 100; cursor: pointer; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 8px; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes bounce { 0%,80%,100% { transform: scale(0); } 40% { transform: scale(1); } }
</style>
</head>
<body>

<div class="top-bar">
  <h1>Playground</h1>
  <a href="live.html">Dashboard</a>
</div>

<div class="image-picker" id="imagePicker"></div>

<div class="chat-area" id="chatArea">
  <div class="msg system"><div class="msg-bubble">Select an image above, then type a guidance prompt to run the pipeline.</div></div>
</div>

<div class="input-bar">
  <input type="text" id="promptInput" placeholder="Type a guidance prompt..." disabled>
  <button id="sendBtn" disabled>Send</button>
</div>

<div class="lightbox" id="lightbox" onclick="this.classList.remove('open')">
  <img id="lightboxImg">
</div>

<script>
let selectedImage = null;
let isRunning = false;

const chatArea = document.getElementById('chatArea');
const promptInput = document.getElementById('promptInput');
const sendBtn = document.getElementById('sendBtn');

async function loadImages() {
  try {
    const resp = await fetch('/api/playground/images');
    const images = await resp.json();
    const picker = document.getElementById('imagePicker');
    images.forEach(name => {
      const img = document.createElement('img');
      img.src = 'images/' + name;
      img.alt = name;
      img.title = name.replace('.jpg', '');
      img.onclick = () => selectImage(name, img);
      picker.appendChild(img);
    });
  } catch (e) {
    console.error('Failed to load images:', e);
  }
}

function selectImage(name, el) {
  if (isRunning) return;
  const prev = document.querySelector('.image-picker img.selected');
  if (prev) prev.classList.remove('selected');
  el.classList.add('selected');

  if (selectedImage && selectedImage !== name) {
    addSystemMsg('Switched to ' + name.replace('.jpg', ''));
  }
  selectedImage = name;
  promptInput.disabled = false;
  sendBtn.disabled = false;
  promptInput.focus();
}

function addSystemMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg system';
  div.innerHTML = '<div class="msg-bubble">' + text + '</div>';
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function addUserMsg(prompt) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = '<div class="msg-bubble">"' + escHtml(prompt) + '"</div>';
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function addThinking() {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.id = 'thinkingMsg';
  div.innerHTML = '<div class="msg-bubble thinking"><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><span style="color:#94a3b8;font-size:13px">Running pipeline...</span></div>';
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function removeThinking() {
  const el = document.getElementById('thinkingMsg');
  if (el) el.remove();
}

const STEP_LABELS = {
  step1_rmbg: 'RMBG',
  step3_sam_add: 'SAM Add',
  step3_sam_remove: 'SAM Remove',
  step3_sam_narrow: 'SAM Narrow',
  step4_combined_mask: 'Final Mask',
  step5_edge_refined: 'Alpha',
  step6_final: 'Final',
};

let resultCounter = 0;

function addResult(data) {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  const rid = 'pg_' + (++resultCounter) + '_' + Date.now();

  const mode = data.vlm_mode || 'unknown';
  const targets = (data.vlm_targets || []).join(', ');
  const elapsed = data.elapsed_s || 0;

  let stepsHtml = '';
  const steps = data.step_images || {};
  const origUrl = 'images/' + data.image;

  stepsHtml += '<div class="step-thumb"><img src="' + origUrl + '" onclick="openLightbox(this.src)"><div class="label">Original</div></div>';

  const stepOrder = ['step1_rmbg', 'step3_sam_add', 'step3_sam_remove', 'step3_sam_narrow', 'step4_combined_mask', 'step5_edge_refined'];
  for (const key of stepOrder) {
    if (steps[key]) {
      const label = STEP_LABELS[key] || key;
      stepsHtml += '<div class="step-thumb"><img src="' + steps[key] + '" onclick="openLightbox(this.src)"><div class="label">' + label + '</div></div>';
    }
  }

  let scoresHtml = '';
  if (data.sam_scores && Object.keys(data.sam_scores).length) {
    const parts = Object.entries(data.sam_scores).map(([k,v]) => k + ': ' + v.toFixed(2));
    scoresHtml = '<div class="sam-scores">SAM scores: ' + parts.join(' · ') + '</div>';
  }

  let judgeHtml = '';
  const verdicts = data.judge_verdicts || [];
  if (verdicts.length > 0) {
    const last = verdicts[verdicts.length - 1];
    const retries = verdicts.length - 1;
    const cls = last.passed ? 'pass' : 'fail';
    const label = last.passed ? '✓ PASS' : '✗ FAIL';
    judgeHtml = '<div class="judge-row"><span class="judge-badge-sm ' + cls + '">' + label + '</span>';
    if (!last.passed && last.issues && last.issues.length) {
      judgeHtml += last.issues.map(function(i) {
        return '<div class="judge-issue-sm"><span class="type">' + escHtml(i.type) + '</span> ' +
          escHtml(i.description) + ' <span class="fix">' + escHtml(i.fix) + '</span></div>';
      }).join('');
    }
    if (retries > 0) judgeHtml += '<div class="judge-retry-sm">' + retries + ' correction(s) applied</div>';
    judgeHtml += '</div>';
  }

  const caseId = 'playground:' + (data.image || '') + ':' + (data.prompt || '');

  div.innerHTML = '<div class="msg-bubble">' +
    '<div class="result-header">' +
      '<span class="mode-badge ' + mode + '">' + mode + '</span>' +
      '<span class="targets">' + escHtml(targets) + '</span>' +
      '<span class="elapsed">' + elapsed + 's</span>' +
    '</div>' +
    '<div class="steps-row">' + stepsHtml + '</div>' +
    '<div class="final-result"><img src="' + data.preview_url + '" onclick="openLightbox(this.src)"></div>' +
    scoresHtml +
    judgeHtml +
    '<div class="feedback-row" id="fb_' + rid + '">' +
      '<button class="fb-btn" onclick="sendFeedback(\'' + rid + '\',\'' + escAttr(caseId) + '\',\'like\')" title="Like">' +
        '<span class="icon">&#128077;</span>' +
      '</button>' +
      '<button class="fb-btn" onclick="sendFeedback(\'' + rid + '\',\'' + escAttr(caseId) + '\',\'dislike\')" title="Dislike">' +
        '<span class="icon">&#128078;</span>' +
      '</button>' +
      '<input class="fb-comment" id="fbc_' + rid + '" placeholder="Optional comment...">' +
      '<button class="fb-send" onclick="sendFeedback(\'' + rid + '\',\'' + escAttr(caseId) + '\',\'comment\')" title="Send comment">Send</button>' +
    '</div>' +
  '</div>';

  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function addError(msg) {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.innerHTML = '<div class="msg-bubble" style="border-color:#ef4444;color:#fca5a5">Error: ' + escHtml(msg) + '</div>';
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

async function send() {
  const prompt = promptInput.value.trim();
  if (!prompt || !selectedImage || isRunning) return;

  isRunning = true;
  promptInput.value = '';
  sendBtn.disabled = true;
  promptInput.disabled = true;

  addUserMsg(prompt);
  addThinking();

  try {
    const resp = await fetch('/api/playground/run', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({image: selectedImage, prompt: prompt}),
    });
    const data = await resp.json();
    removeThinking();

    if (data.ok) {
      addResult(data);
    } else {
      addError(data.error || 'Unknown error');
    }
  } catch (e) {
    removeThinking();
    addError(e.message);
  }

  isRunning = false;
  promptInput.disabled = false;
  sendBtn.disabled = false;
  promptInput.focus();
}

function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function escAttr(s) {
  return s.replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

async function sendFeedback(rid, caseId, action) {
  const row = document.getElementById('fb_' + rid);
  if (!row) return;
  const commentInput = document.getElementById('fbc_' + rid);
  const comment = commentInput ? commentInput.value.trim() : '';

  let vote = action;
  if (action === 'comment') {
    if (!comment) return;
    vote = 'dislike';
  }

  const btns = row.querySelectorAll('.fb-btn');
  btns.forEach(b => b.classList.remove('active-like', 'active-dislike'));
  if (vote === 'like') btns[0].classList.add('active-like');
  if (vote === 'dislike') btns[1].classList.add('active-dislike');

  try {
    await fetch('/api/feedback', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ case_id: caseId, vote: vote, comment: comment }),
    });
    if (comment || action === 'comment') {
      const sent = document.createElement('span');
      sent.className = 'fb-sent';
      sent.textContent = ' Sent!';
      row.appendChild(sent);
      setTimeout(() => sent.remove(), 2000);
      if (commentInput) commentInput.value = '';
    }
  } catch (e) {
    console.error('Feedback failed:', e);
  }
}

sendBtn.onclick = send;
promptInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

async function loadHistory() {
  try {
    const resp = await fetch('/api/playground/history');
    const entries = await resp.json();
    if (!entries.length) return;
    addSystemMsg(entries.length + ' previous results loaded');
    let lastImg = '';
    for (const data of entries) {
      if (!data.ok) continue;
      if (data.image && data.image !== lastImg) {
        addSystemMsg('Image: ' + data.image.replace('.jpg',''));
        lastImg = data.image;
      }
      addUserMsg(data.prompt || '?');
      addResult(data);
    }
  } catch (e) {
    console.error('Failed to load history:', e);
  }
}

loadImages();
loadHistory();
</script>
</body>
</html>
